name: Deploy website to Cloudflare Pages

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to commit SHAs (v4.4.0 and v3.9.0) so a moved tag cannot change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check for the Cloudflare token
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN is not set in the repository secrets, so the deploy step is skipped."
          fi

      # main deploys to production (outbreaklens.com). Any other branch deploys a
      # preview at https://<branch>.outbreaklens.pages.dev and leaves production alone.
      - name: Deploy website/ to the Pages project outbreaklens
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@9681c2997648301493e78cacbfb790a9f19c833f # v3.9.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9225fa26913cdf58e48597a533972035
          command: pages deploy website --project-name=outbreaklens --branch=${{ github.ref_name }} --commit-dirty=true
